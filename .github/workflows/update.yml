name: Atnaujinti duomenis
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python resolve_ids.py
      - run: python fetch_schedule.py
        continue-on-error: true
      - run: python update.py
      - run: python build_ticker.py
      - run: python fetch_gamephotos.py
        continue-on-error: true
      - run: python fetch_ncaa_top25.py
        continue-on-error: true
      - run: python fetch_logos.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        continue-on-error: true
      - run: python fetch_photos.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        continue-on-error: true
      - run: python fetch_context.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        continue-on-error: true
      - run: python build_pages.py
      - name: Išsaugoti pakeitimus
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data players sitemap.xml
          if git diff --staged --quiet; then echo "Pakeitimų nėra"; exit 0; fi
          git commit -m "Atnaujinti duomenis"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Bandymas $i nepavyko, laukiu..."
            sleep $((i * 15))
          done
          exit 1
