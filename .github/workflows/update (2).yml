name: Atnaujinti duomenis
on:
  schedule:
    - cron: "23 */2 * * *"
    - cron: "37 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python resolve_ids.py
        continue-on-error: true
      - run: python fetch_schedule.py
        continue-on-error: true
      - run: python update.py
      - run: python build_ticker.py
      - run: python build_form.py
      - run: python build_records.py
      - run: python build_notify.py
      - run: python fetch_gamephotos.py
        continue-on-error: true
      - run: python fetch_shots.py
        continue-on-error: true
      - run: python fetch_ncaa_top25.py
        continue-on-error: true
      - run: python fetch_logos.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 6 * * *'
        continue-on-error: true
      - run: python fetch_photos.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 6 * * *'
        continue-on-error: true
      - run: python fetch_context.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 6 * * *'
        continue-on-error: true
      - run: python make_icons.py
        if: hashFiles('icons/icon-512.png') == ''
      - run: python build_pages.py
      - name: Išsaugoti pakeitimus
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data players sitemap.xml icons
          if git diff --staged --quiet; then echo "Pakeitimų nėra"; exit 0; fi
          git commit -m "Atnaujinti duomenis"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Bandymas $i nepavyko, laukiu..."
            sleep $((i * 15))
          done
          exit 1
      - name: Pranešimas (OneSignal)
        continue-on-error: true
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python send_push.py
