<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LT NCAA Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>
<header>
  <div><h1>LT NCAA TRACKER</h1><p class="sub">Lietuviai NCAA Division I · 2026–27</p></div>
  <div class="upd" id="upd"></div>
</header>
<div class="tabs"><a class="on" href="index.html">Žaidėjai</a><a href="results.html">Rezultatai</a><a href="charts.html">Grafikai</a><a href="insights.html">Perliukai</a></div>
<nav class="bar">
  <div class="seg" id="period">
    <button data-p="week">Turas</button><button data-p="month">Mėnuo</button><button data-p="season" class="on">Sezonas</button>
  </div>
  <input id="q" type="search" placeholder="Ieškoti žaidėjo ar komandos">
  <select id="conf"><option value="">Visos konferencijos</option></select>
  <select id="sort">
    <option value="name">Pagal vardą</option><option value="pts">Taškai</option><option value="reb">Atkovoti</option>
    <option value="ast">Perdavimai</option><option value="height">Ūgis</option>
  </select>
</nav>
<main>
  <section class="card" id="leaders"></section>
  <section id="grid" class="grid"></section>
</main>
<div id="sheet" hidden></div>
<footer>Duomenys: ESPN / NCAA. Skaičiuojama iš rungtynių boxscore. · LT NCAA Tracker</footer>
<script src="app.js"></script>
</body>
</html>
