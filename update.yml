name: Atnaujinti duomenis
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python resolve_ids.py
      - run: python fetch_schedule.py
        continue-on-error: true
      - run: python update.py
      - run: python fetch_ncaa_top25.py
        continue-on-error: true
      - run: python fetch_logos.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        continue-on-error: true
      - run: python fetch_photos.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        continue-on-error: true
      - run: python fetch_context.py
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        continue-on-error: true
      - run: python build_pages.py
      - name: Išsaugoti pakeitimus
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data players sitemap.xml
          git diff --staged --quiet || (git commit -m "Atnaujinti duomenis" && git push)
