<meta charset="utf-8">

<meta name="theme-color" content="#07090c">
<link rel="canonical" href="https://andriuspanama.github.io/lt-ncaa-tracker/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website"><meta property="og:locale" content="lt_LT">
<meta property="og:title" content="Žaidėjai · LT NCAA Tracker"><meta property="og:description" content="Visi Lietuvos krepšininkai NCAA Division I: komandos, ūgis, statistika ir profiliai."><meta property="og:url" content="https://andriuspanama.github.io/lt-ncaa-tracker/">

<script src="theme.js"></script>
<title>LT NCAA Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extra.css">
<link rel="stylesheet" href="polish.css">
</head>
<body>
<header>
  <div><p class="sub">Lietuviai NCAA Division I · 2026–27</p></div>
  <div class="upd" id="upd"></div>
</header>
<div class="tabs"><a class="on" href="index.html">Žaidėjai</a><a href="results.html">Rezultatai</a><a href="charts.html">Grafikai</a><a href="insights.html">Perliukai</a><a href="metodika.html">Metodika</a></div>
<nav class="bar">
  <div class="seg" id="period">
    <button data-p="week">Turas</button><button data-p="month">Mėnuo</button><button data-p="season" class="on">Sezonas</button>
  </div>
  <input id="q" type="search" placeholder="Ieškoti žaidėjo ar komandos">
  <select id="conf"><option value="">Visos konferencijos</option></select>
  <select id="sort">
    <option value="name">Pagal vardą</option><option value="pts">Taškai</option><option value="reb">Atkovoti</option>
    <option value="ast">Perdavimai</option><option value="height">Ūgis</option>
  </select>
</nav>
<main>
  <section class="card" id="leaders"></section>
  <section id="grid" class="grid"></section>
</main>
<div id="sheet" hidden></div>
<footer>Duomenys: ESPN / NCAA. Skaičiuojama iš rungtynių boxscore. · LT NCAA Tracker · <a href="metodika.html">Metodika</a> · Neoficialus projektas, nesusijęs su NCAA ar ESPN.</footer>
<script src="media.js"></script>
<script src="app.js"></script>
</body>
</html>
